[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tuicr-agent-runner"
version = "0.1.0"
description = "Explicit tuicr feedback batches for fresh Claude Code runs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tuicr-agent-runner = "tuicr_agent_runner.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
